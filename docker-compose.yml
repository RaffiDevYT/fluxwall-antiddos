version: '3.8'

services:
  # 1. OpenResty Anti-DDoS Edge Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxwall_gateway
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_API_KEY=super-secret-admin-key-2026
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
    volumes:
      - ./conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./lua:/usr/local/openresty/nginx/lua:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - fluxwall_net

  # 2. Redis In-Memory State & Rate Limiting Backend
  redis:
    image: redis:7-alpine
    container_name: fluxwall_redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    networks:
      - fluxwall_net

  # 3. Next.js Cyber Defense Admin Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fluxwall_dashboard
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_URL=http://gateway:80/healthz
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - fluxwall_net

  # 4. Upstream Mock Backend Server (Node.js)
  backend:
    image: node:20-alpine
    container_name: fluxwall_backend
    working_dir: /app
    volumes:
      - ./docker/backend:/app:ro
    command: node server.js
    restart: unless-stopped
    networks:
      - fluxwall_net

  # 5. Let's Encrypt Certbot Automated Zero-Touch ACME Provisioner
  certbot:
    image: certbot/certbot:latest
    container_name: fluxwall_certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - fluxwall_net

volumes:
  certbot_www:
  certbot_certs:

networks:
  fluxwall_net:
    driver: bridge
