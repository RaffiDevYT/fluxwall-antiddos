worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens off;

    # Lua Shared Memory Dictionaries
    lua_shared_dict ip_cache 10m;             # L1 memory fast cache for whitelist/blacklist
    lua_shared_dict local_counters 20m;       # Fallback counters & surge QPS tracking
    lua_shared_dict prometheus_metrics 10m;   # Prometheus metrics store

    # Lua package search path
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Global Lua Initialization
    init_by_lua_block {
        require "resty.core"
        _G.APP_CONFIG = require("config")
        ngx.log(ngx.INFO, "[Gateway] Security Gateway Initialized successfully with Surge Protection & Prometheus Metrics")
    }

    # Structured JSON Log Format for Security Auditing
    log_format security_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"real_ip":"$http_x_real_ip",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer"'
    '}';

    access_log /usr/local/openresty/nginx/logs/access.log security_json;
    error_log  /usr/local/openresty/nginx/logs/error.log warn;

    # Upstream Backend Server Definition
    upstream backend_servers {
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Main Gateway Server Block
    server {
        listen 80;
        server_name _;

        # 1. Healthcheck endpoint
        location /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"fluxwall-antiddos"}';
        }

        # 2. Prometheus Metrics Scrape Endpoint
        location /metrics {
            access_log off;
            default_type "text/plain; version=0.0.4";
            content_by_lua_block {
                local metrics = require "metrics"
                ngx.say(metrics.export_prometheus_text())
            }
        }

        # 3. Admin Web Dashboard UI
        location /admin/ {
            alias /usr/local/openresty/nginx/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 4. Protected Admin REST API
        location /api/admin/ {
            access_log off;
            content_by_lua_block {
                local admin_api = require "admin_api"
                admin_api.handle_request()
            }
        }

        # 5. Main application reverse proxy with edge inspection
        location / {
            # Execute Anti-DDoS, bot detection, surge mode, and rate limiting logic
            access_by_lua_file /usr/local/openresty/nginx/lua/gateway.lua;

            # Proxy to backend servers
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets with caching
        location /static/ {
            access_by_lua_file /usr/local/openresty/nginx/lua/gateway.lua;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
