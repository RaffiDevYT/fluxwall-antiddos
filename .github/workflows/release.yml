name: FluxWall CI & Multi-Package Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Automated Test Job
  test:
    name: Run Test Suite & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Shell Scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n bin/fluxwall.sh
          bash -n test/test_rate_limit.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Gateway Image
        run: |
          docker compose build

      - name: Boot Stack & Healthcheck Verification
        run: |
          docker compose up -d
          sleep 5
          curl -s http://127.0.0.1:8080/healthz | grep -q "fluxwall-antiddos" && echo "Healthcheck PASSED!"
          docker compose down

  # 2. Automated Multi-Package Builder & Dynamic Release (DEB, RPM, TAR.GZ)
  package:
    name: Build Packages (DEB, RPM, TAR.GZ)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Packaging Tools (dpkg, rpm, alien)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm alien

      - name: Build Packages
        run: |
          RAW_VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${RAW_VERSION:-"1.0.1"}
          if [[ "$VERSION" == "refs/heads/main" || "$VERSION" == "main" ]]; then
            VERSION="1.0.1"
          fi
          mkdir -p dist

          # 1. Build .tar.gz Source Archive
          tar -czvf "dist/fluxwall-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            .

          # 2. Build .deb Package (Debian / Ubuntu)
          DEB_DIR="/tmp/fluxwall-deb"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/fluxwall-antiddos"
          mkdir -p "$DEB_DIR/usr/local/bin"

          # Copy project files into /opt/fluxwall-antiddos
          cp -r bin conf dashboard docker docs lua scripts test Dockerfile docker-compose.yml install.sh uninstall.sh LICENSE README.md "$DEB_DIR/opt/fluxwall-antiddos/"
          chmod +x "$DEB_DIR/opt/fluxwall-antiddos/bin/fluxwall.sh"
          chmod +x "$DEB_DIR/opt/fluxwall-antiddos/scripts/"*.sh

          # Create CLI symlink
          ln -sf /opt/fluxwall-antiddos/bin/fluxwall.sh "$DEB_DIR/usr/local/bin/fluxwall"

          # Create Debian Control File
          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: fluxwall
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: all
          Maintainer: RaffiDevYT <https://github.com/RaffiDevYT>
          Description: High-Performance Layer-7 Anti-DDoS & Rate Limiting Gateway
           FluxWall is a modern edge security reverse proxy gateway built on OpenResty
           (Nginx + LuaJIT) and Redis with Adaptive Surge Protection and JS PoW Challenge.
          EOF

          # Create Debian Post-Install Hook
          cat << 'EOF' > "$DEB_DIR/DEBIAN/postinst"
          #!/bin/sh
          chmod +x /opt/fluxwall-antiddos/bin/fluxwall.sh
          chmod +x /opt/fluxwall-antiddos/scripts/*.sh
          ln -sf /opt/fluxwall-antiddos/bin/fluxwall.sh /usr/local/bin/fluxwall
          echo "FluxWall installed successfully in /opt/fluxwall-antiddos. Type 'fluxwall' to manage."
          exit 0
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          # Build .deb
          dpkg-deb --build "$DEB_DIR" "dist/fluxwall_${VERSION}-1_all.deb"

          # 3. Build .rpm Package (RHEL / CentOS / AlmaLinux / Fedora)
          alien --to-rpm --scripts "dist/fluxwall_${VERSION}-1_all.deb"
          mv *.rpm dist/ 2>/dev/null || true

          # 4. Generate SHA256 Checksums
          cd dist
          sha256sum * > SHA256SUMS

      - name: Generate Dynamic Commit Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          echo "## 🚀 What's Changed in ${CURRENT_TAG}:" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md
          else
            git log -n 15 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 📦 Package Builds & Binaries:" >> release_notes.md
          echo "* **Debian / Ubuntu Package**: `fluxwall_*.deb` *(Install via `sudo dpkg -i <file>.deb`)*" >> release_notes.md
          echo "* **RHEL / CentOS / AlmaLinux**: `fluxwall-*.noarch.rpm` *(Install via `sudo rpm -ivh <file>.rpm`)*" >> release_notes.md
          echo "* **Source Tarball**: `fluxwall-*.tar.gz`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### ⚡ 1-Line VPS Quick Install:" >> release_notes.md
          echo "```bash" >> release_notes.md
          echo "curl -fsSL https://raw.githubusercontent.com/RaffiDevYT/fluxwall-antiddos/main/install.sh | sudo bash" >> release_notes.md
          echo "```" >> release_notes.md

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxwall-packages
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          body_path: release_notes.md
